version: "2"

run:
  go: "1.26"
  timeout: 5m
  tests: true
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # Error handling.
    - errcheck
    - errorlint
    - err113
    - nilerr
    - nilnesserr
    - wrapcheck
    - errchkjson
    - errname
    # Type safety.
    - forcetypeassert
    - ireturn
    - asasalint
    - musttag
    - recvcheck
    # Complexity.
    - cyclop
    - gocognit
    - funlen
    - nestif
    # Modern Go.
    - modernize
    - intrange
    - copyloopvar
    - usestdlibvars
    - exptostd
    - usetesting
    # Shadows and dead code.
    - govet
    - predeclared
    - unused
    - ineffassign
    - wastedassign
    - unconvert
    - unparam
    # Security and resource handling.
    - gosec
    - sqlclosecheck
    - rowserrcheck
    - bodyclose
    - noctx
    - contextcheck
    - bidichk
    - asciicheck
    # Style and maintainability.
    - staticcheck
    - revive
    - gocritic
    - goconst
    - prealloc
    - tagliatelle
    - nonamedreturns
    - nolintlint
    - nosprintfhostport
    - gocheckcompilerdirectives
    - mirror
    - misspell
    - dupword
    - perfsprint
    - whitespace
    - canonicalheader
    - unqueryvet
    # Enum and exhaustiveness.
    - exhaustive
    - fatcontext
    - durationcheck
    # Testing.
    - thelper
    - paralleltest
    - tparallel
    - testifylint
    # Logging and forbidden calls.
    - zerologlint
    - forbidigo

  settings:
    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print"
          msg: "use zerolog instead of fmt.Print"
        - pattern: "^time\\.Sleep"
          msg: "use context-aware waits/timers instead of time.Sleep"
        - pattern: "^panic\\("
          msg: "never panic - return errors instead"

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close

    ireturn:
      allow:
        - error
        - stdlib
        - generic

    cyclop:
      max-complexity: 10

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50

    nestif:
      min-complexity: 4

    govet:
      enable-all: true
      disable:
        - fieldalignment

    nolintlint:
      require-explanation: true
      require-specific: true

    musttag:
      functions:
        - name: encoding/json.Marshal
          tag: json
          arg-pos: 0
        - name: encoding/json.MarshalIndent
          tag: json
          arg-pos: 0
        - name: encoding/json.Unmarshal
          tag: json
          arg-pos: 1
        - name: (*encoding/json.Encoder).Encode
          tag: json
          arg-pos: 0
        - name: (*encoding/json.Decoder).Decode
          tag: json
          arg-pos: 0

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      excludes: []

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - unnamedResult

    tagliatelle:
      case:
        rules:
          json: snake

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - cyclop
          - wrapcheck
          - err113
          - gocritic
          - gocognit
          - musttag
          - errchkjson
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/hueyexe/gnews-mcp)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$